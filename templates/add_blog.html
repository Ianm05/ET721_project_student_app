{% extends 'base.html' %}

{% block content %}

<h1>Create Blog Post</h1>

<form method="POST">

    <input
        type="text"
        name="title"
        class="form-control mb-3"
        placeholder="Blog Title"
        required
    >

    <textarea
        name="content"
        class="form-control mb-3"
        rows="6"
        placeholder="Write your blog here..."
        required
    ></textarea>

    <button class="btn btn-success">
        Publish Blog
    </button>

</form>

{% endblock %}
