{% extends 'base.html' %}

{% block content %}

<h1>Upload Note</h1>

<form method="POST" enctype="multipart/form-data">

    <input
        type="text"
        name="subject"
        class="form-control mb-3"
        placeholder="Subject"
        required
    >

    <input
        type="file"
        name="note_image"
        class="form-control mb-3"
        required
    >

    <button class="btn btn-warning">
        Upload
    </button>

</form>

{% endblock %}
