{% extends 'base.html' %}

{% block content %}

<h1>Add Task</h1>

<form method="POST">

    <input
        type="text"
        name="title"
        class="form-control mb-3"
        placeholder="Task Title"
        required
    >

    <select
        name="category"
        class="form-control mb-3"
    >

        <option value="Academic">
            Academic
        </option>

        <option value="Personal">
            Personal
        </option>

        <option value="Homework">
            Homework
        </option>

        <option value="Exams">
            Exams
        </option>

    </select>

    <button class="btn btn-primary">
        Add Task
    </button>

</form>

{% endblock %}
