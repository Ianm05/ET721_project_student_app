{% extends 'base.html' %}

{% block content %}

<h1>Your Notes</h1>

<a href="/upload_note" class="btn btn-warning mb-3">
    Upload Note
</a>

{% if notes %}

    {% for note in notes %}

        <div class="card p-4 mb-4">

            <h4>{{ note.subject }}</h4>

            <img
                src="{{ url_for('static', filename='uploads/' + note.filename) }}"
                class="img-fluid mb-3"
                width="300"
            >

            <p>{{ note.filename }}</p>

            <a href="/delete_note/{{ note.id }}"
               class="btn btn-danger">
                Delete
            </a>

           <p> Noted: {{ note.created_at.strftime('%B %d, %Y at %I:%M %p') }} </P>
        </div>

    {% endfor %}

{% else %}

    <p>No uploaded notes yet.</p>

{% endif %}


{% endblock %}
